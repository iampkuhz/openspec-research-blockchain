# Source Pack

version: "1.0"
topic: <topic-name>
generated_at: <date>
updated_at: <date>

metadata:
  total_sources: <数量>
  by_tier:
    L1: <数量>
    L2: <数量>
    L3: <数量>
    L4: <数量>
  by_type:
    standard: <数量>
    implementation: <数量>
    blog: <数量>
    discussion: <数量>

sources:
  - source_id: <unique-id>
    title: <标题>
    url: <链接或本地引用>
    source_type: standard|implementation|blog|discussion
    source_tier: L1|L2|L3|L4
    accessed_at: <日期>
    archived:
      archived: true|false
      archive_path: <path>
      archived_at: <date>
      archive_type: pdf|screenshot|text
    relevant_atoms:
      - definition
      - core-mechanism
    supported_claims:
      - claim-001
      - claim-002
    confidence: high|medium|low
    quality_score: 4.5  # 1-5
    notes: <可选说明>

  - source_id: eip-4337
    title: "ERC-4337: Account Abstraction Using Alt Mempool"
    url: https://eips.ethereum.org/EIPS/eip-4337
    source_type: standard
    source_tier: L1
    accessed_at: 2024-01-15
    archived:
      archived: true
      archive_path: sources/fetched/eip-4337.pdf
      archived_at: 2024-01-15
      archive_type: pdf
    relevant_atoms:
      - definition
      - core-mechanism
      - limits-and-assumptions
    supported_claims:
      - claim-001
      - claim-002
      - claim-003
    confidence: high
    quality_score: 5.0
    notes: "核心来源，完整规范"

  - source_id: account-abstraction-repo
    title: "Account Abstraction Reference Implementation"
    url: https://github.com/eth-infinitism/account-abstraction
    source_type: implementation
    source_tier: L2
    accessed_at: 2024-01-15
    archived:
      archived: false
      notes: "GitHub 仓库，持续更新"
    relevant_atoms:
      - core-mechanism
    supported_claims:
      - claim-010
    confidence: high
    quality_score: 4.5
    notes: "参考实现，用于验证规范理解"

# 证据缺口
evidence_gaps:
  - gap_id: GAP-001
    description: <缺口描述>
    impact: <影响>
    related_claims:
      - claim-xxx
    status: unresolved|pending|resolved

# 来源冲突
conflicts:
  - conflict_id: CONF-SRC-001
    description: <冲突描述>
    sources:
      - source_id: <source-a>
        claim: <说法 A>
      - source_id: <source-b>
        claim: <说法 B>
    resolution: <解决方式>
    status: resolved|unresolved
