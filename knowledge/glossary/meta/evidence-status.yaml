# Evidence Status - 证据状态

version: "1.0"
updated_at: 2026-04-02

## Evidence Levels (证据等级)

### L1: Primary Standard

来源：
- 官方规范文档
- EIP / RFC
- 白皮书

可信度：最高

使用：核心技术主张的主要证据

### L2: Primary Implementation

来源：
- 参考实现代码
- 官方 SDK / API 文档
- 官方开发者文档

可信度：高

使用：技术主张的支持证据

### L3: Official Ecosystem

来源：
- 官方博客
- Release notes
- Roadmap
- 生态系统材料

可信度：中

使用：背景、动机、非技术主张

### L4: Third-Party

来源：
- 第三方分析
- 技术博客
- 媒体文章
- 社区讨论

可信度：低

使用：社区观点参考，不可作为核心技术主张证据

## Confidence Levels (置信度)

### High

条件：
- 有 L1 证据支持
- 或多个独立 L2 证据
- 无冲突来源

### Medium

条件：
- 有 L2 证据支持
- 或 L1 证据但有 minor 冲突
- 或多个一致 L3 证据

### Low

条件：
- 仅有 L3/L4 证据
- 或有重大来源冲突
- 或基于假设的分析

## Evidence Gap Status

### Unresolved

描述：已知但未解决的证据缺口。

处理：
- 在 open-questions.md 中记录
- 降低相关结论置信度
- 追踪来源更新

### Pending Verification

描述：有待验证的主张。

处理：
- 标注为待验证
- 计划验证步骤
- 记录验证方法

### Resolved

描述：已解决的证据缺口。

处理：
- 更新相关 claims
- 记录解决来源
- 更新 changelog

## Usage Rules

1. **技术主张优先 L1/L2** - 核心机制主张必须有 L1 或 L2 支持
2. **标注证据等级** - 每个 claim 必须标注 evidence_level
3. **记录缺口** - 证据不足时必须记录 evidence gap
4. **降低强度** - 仅有 L3/L4 时必须降低结论强度
