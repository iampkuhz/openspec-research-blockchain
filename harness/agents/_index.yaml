# Agent Registry

version: "1.0"
description: |
  第一版 multi-agent roster。
  workflow 与命令层在需要多 agent 编排时应优先读取本索引。

agents:
  - name: orchestrator
    mode: always
    file: orchestrator.md
    owns: "任务分类、agent 激活、handoff 控制、最终整合"

  - name: research-author-agent
    mode: always
    file: research-author-agent.md
    owns: "request.md、plan.md、draft.md 主链"

  - name: source-evidence-agent
    mode: always
    file: source-evidence-agent.md
    owns: "sources/、excerpts、source-review、evidence gaps"

  - name: review-critic-agent
    mode: always
    file: review-critic-agent.md
    owns: "独立 technical review、traceability audit、terminology consistency"

  - name: publish-agent
    mode: always
    file: publish-agent.md
    owns: "artifact 提炼、update impact scan、apply 前检查"

  - name: diagram-agent
    mode: conditional
    file: diagram-agent.md
    activation: "primitive / mechanism-heavy / 明确需要图表"
    owns: "diagram checklist、brief、diagram package、contract validation"

  - name: governance-review-agent
    mode: conditional
    file: governance-review-agent.md
    activation: "修改 openspec/**、harness/**、AGENTS.md、docs/governance/"
    owns: "OpenSpec / Harness 边界评审"

categories:
  always_on:
    - orchestrator
    - research-author-agent
    - source-evidence-agent
    - review-critic-agent
    - publish-agent
  conditional:
    - diagram-agent
    - governance-review-agent

handoff_artifacts:
  - request.md
  - plan.md
  - draft.md
  - sources/source-review.md
  - review/checklist.yaml
  - review/issues.md
  - review/review-summary.md
