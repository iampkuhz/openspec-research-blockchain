# 阶段索引

version: "2.0"
description: |
  按研究阶段声明依赖的 specs 与 rules。
  阶段切换时，Agent 读取本索引中该阶段的 depends 声明，自动加载对应文件。
  已对齐新版 artifact / research rules 分类。
  "conditional" 标记的规则只在 plan/draft 明确声明相关需求时加载。
  加载预算：每阶段无条件加载的规则总行数应控制在 ~500 行以内；
  超过 200 行的规则应优先考虑 conditional 标记，除非该阶段必然需要。

phases:
  request:
    description: "研究请求定义"
    depends:
      specs:
        - evidence-policy
      rules:
        - general/terminology-policy
        - research/primitive-quality-rules
        - artifacts/request-rules
      workflows:
        - research-intake-routing

  plan:
    description: "研究计划生成"
    depends:
      specs:
        - evidence-policy
        - research-object-model
      rules:
        - general/traceability-policy
        - research/source-quality-rules
        - artifacts/plan-rules
      workflows:
        - research-intake-routing

  sources:
    description: "来源收集与证据映射"
    depends:
      specs:
        - evidence-policy
      rules:
        - general/traceability-policy
        - research/source-quality-rules
        - research/uncertainty-rules
        - artifacts/source-pack-rules
        - artifacts/evidence-map-rules
        - artifacts/note-rules
        - artifacts/claim-rules
      workflows:
        - source-workflow

  draft:
    description: "集中研究写作"
    depends:
      specs:
        - evidence-policy
        - analysis-principles
        - canonical-output-model
        - research-object-model
      rules:
        - research/primitive-quality-rules
        - research/synthesis-quality-rules
        - research/decision-quality-rules
        - research/uncertainty-rules
        - research/traceability-rules
        - research/evidence-policy
        - artifacts/draft-rules
        # 条件加载：plan 声明正式图表时加载
        - conditional:diagrams/diagram-policy
        # 条件加载：draft 包含表格时加载
        - conditional:writing/table-rules
        # 条件加载：draft 包含长摘要/executive summary 时加载
        - conditional:writing/summary-rules
      workflows:
        - diagram-workflow
        - research-step-execution

  review:
    description: "研究评审"
    depends:
      specs:
        - evidence-policy
      rules:
        - general/terminology-policy
        - general/traceability-policy
        - writing/structure-rules
        - diagrams/diagram-review-checklist
        - artifacts/review-rules
      workflows:
        - research-step-execution

  publish:
    description: "发布到 Knowledge"
    depends:
      specs:
        - evidence-policy
        - canonical-output-model
      rules:
        - general/traceability-policy
        - general/update-policy
        - writing/language-rules
        - artifacts/publish-rules
      workflows:
        - research-publish-flow
