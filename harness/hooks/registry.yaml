# Hook Registry — Hook Event -> Gate Runner 映射
#
# 职责：声明「什么时候、运行哪个 gate runner」。
# 不定义 gate 本身（那是 harness/gates/registry.yaml 的职责）。
# 不定义 validator 脚本路径（那是 scripts/hooks/validators/registry.yaml 的职责）。
#
# 边界：
# - 本文件属于 Harness execution layer，不是 OpenSpec canonical policy。
# - Gate 定义在 harness/gates/registry.yaml。
# - Validator 映射在 scripts/hooks/validators/registry.yaml。

version: 1

hook_bindings:
  post_write:
    description: "文件写入后，根据变更文件和当前 change 状态推断需要运行的 gate。"
    command: "python scripts/hooks/dispatch.py --event post_write --gate-registry harness/gates/registry.yaml --validator-registry scripts/hooks/validators/registry.yaml"

  stop:
    description: "Claude 本轮停止前，汇总当前 change 的 gate 状态。"
    command: "python scripts/hooks/dispatch.py --event stop --gate-registry harness/gates/registry.yaml --validator-registry scripts/hooks/validators/registry.yaml"

  pre_publish:
    description: "发布前强制运行 pre_publish gate。"
    command: "python scripts/hooks/dispatch.py --event pre_publish --gate pre_publish --gate-registry harness/gates/registry.yaml --validator-registry scripts/hooks/validators/registry.yaml"
