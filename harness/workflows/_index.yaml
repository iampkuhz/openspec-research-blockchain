# 工作流索引

version: "2.0"
description: |
  Active workflow index，对齐 spec-research / spec-research-step / spec-governance-review command 体系。
  当 workflow 支持 multi-agent 执行时，命令层和协作入口还应同时读取
  `.claude/agents/` 目录中的 agent 合同。

workflows:
  research_pipeline:
    path: harness/workflows/research-pipeline.md
    command: /spec-research
    outputs:
      - change.yaml
      - request.md
      - plan.md
      - sources/source-pack.md
      - sources/evidence-map.md
      - draft.md
      - review.md
      - publish.md
      - knowledge/**/artifact.md
      - knowledge/decisions/**/verdict.md

  research_intake_routing:
    path: harness/workflows/research-intake-routing.md
    command: /spec-research
    outputs:
      - change.yaml
      - request.md
      - plan.md

  research_step_execution:
    path: harness/workflows/research-step-execution.md
    command: /spec-research-step
    outputs:
      - sources/source-pack.md
      - sources/evidence-map.md
      - notes/*.md
      - claims/*.md
      - draft.md
      - review.md
      - publish.md
      - knowledge/**/artifact.md
      - knowledge/decisions/**/verdict.md

  source_workflow:
    path: harness/workflows/source-workflow.md
    stage: sources
    outputs:
      - sources/source-pack.md
      - sources/evidence-map.md
      - notes/*.md
      - claims/*.md

  research_publish_flow:
    path: harness/workflows/research-publish-flow.md
    command: /spec-research-step
    stage: publish
    outputs:
      - publish.md
      - knowledge/**/artifact.md
      - knowledge/decisions/**/verdict.md

  source_reading:
    path: harness/workflows/source-reading-workflow.md
    task_type: source_reading

  primitive:
    path: harness/workflows/primitive-workflow.md
    task_type: primitive

  synthesis:
    path: harness/workflows/synthesis-workflow.md
    task_type: synthesis

  decision:
    path: harness/workflows/decision-workflow.md
    task_type: decision

  governance_review:
    path: harness/workflows/governance-review-workflow.md
    command: /spec-governance-review
