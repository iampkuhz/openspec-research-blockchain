name: blockchain-research
version: 3
description: 面向区块链技术调研的研究驱动 OpenSpec 工作流

# =============================================================================
# 系统约束：资产模型（单一事实源）
# =============================================================================
# 本仓库只有一套长期资产模型：
# - 过程层：openspec/changes/<change-id>/ 中的 request.md, plan.md, draft.md 等
# - 长期资产层：knowledge/analysis/ 和 knowledge/decisions/ 中的 artifact.md / verdict.md
#
# knowledge/topics/ 是遗留目录，不再作为主线 canonical 资产目标
# atoms/claims/terms 是可选中间工作结构，不作为长期正式产物
# =============================================================================

context: |
  仓库类型：基于 OpenSpec 的区块链技术调研工作台。

  长期正式资产统一挂在 knowledge/ 下，分为两类：
  - knowledge/analysis/primitives/<domain_id>/<topic_slug>/artifact.md：底层机制研究（按 domain 分组）
  - knowledge/analysis/synthesis/<topic_slug>/artifact.md：演进/综合分析（扁平化）
  - knowledge/decisions/<domain_id>/<topic_slug>/artifact.md + verdict.md：场景决策分析

  研究对象模型：
  - primitive：单个协议、EIP、机制
  - synthesis：多个对象之间的关系、演进、分类
  - decision：面向场景的比较、选型与判断

  domain 是 taxonomy / 浏览分组概念，不是独立的 object_type。

  研究路径：
  - deep-dive：单个对象深度分析
  - evolution：演进历史分析
  - scenario：场景驱动分析

  写作规则：
  - 遵循 `openspec/specs/analysis-principles/spec.md` 中的分析原则

artifacts:
  # ==========================================================================
  # request.md - 研究问题定义（过程文件）
  # ==========================================================================
  - id: request
    generates: request.md
    description: 定义研究问题、范围与非目标
    template: request.md
    instruction: |
      创建研究入口文件，定义：
      - 研究对象类型（primitive/synthesis/decision）
      - 研究路径（deep-dive/evolution/scenario）
      - 研究背景与目的
      - 范围与非目标
      - 预期输出

      不提前写结论或完整机制。
    requires: []

  # ==========================================================================
  # plan.md - 研究计划（过程文件）
  # ==========================================================================
  - id: plan
    generates: plan.md
    description: 研究计划、来源规划与依赖声明
    template: plan.md
    instruction: |
      将 request 收紧为可执行计划：
      - 研究路径与预算（deep/focused/light）
      - 核心问题与后续确认问题
      - 来源规划（L1/L2/L3/L4）
      - 依赖声明（synthesis/decision 必需）
      - 完成标准

      这是 plan 文件，不是分析正文。
    requires:
      - request

  # ==========================================================================
  # draft.md - 集中 review 稿（过程文件）
  # ==========================================================================
  - id: draft
    generates: draft.md
    description: 合并术语、分析与结论的集中 review 文件
    template: draft.md
    instruction: |
      创建集中 review 用的研究草稿：
      - 先补关键术语区
      - 先讲机制，再讨论价值
      - 解释设计原因与替代方案
      - 写清边界、前提、失败条件
      - 输出有限结论
      - 写清不能确认什么

      类型适配：
      - primitive：实体分类、角色与信任边界、角色内部组件、跨角色核心流程、按条件需要的状态转换、能力边界
      - synthesis：演进框架、关系定位、趋势判断
      - decision：场景定义、比较维度、有限结论
    requires:
      - plan

  # ==========================================================================
  # decision-criteria.md - 决策标准（可选过程文件）
  # ==========================================================================
  - id: decision-criteria
    generates: decision-criteria.md
    description: 面向场景比较的决策标准（decision 类型可选）
    template: decision-criteria.md
    instruction: |
      为 scenario 类研究创建决策标准：
      - 定义具体场景
      - 区分 hard constraints / soft preferences
      - 解释每个标准为何重要
      - 定义 confirmed/partial/unclear 判定

      简单决策可直接在 plan.md 中说明，无需单独文件。
    requires:
      - plan

apply:
  # ==========================================================================
  # Apply - 提升到 canonical 资产
  # ==========================================================================
  requires: [draft]
  tracks: null
  instruction: |
    将通过评审的 draft 提升到 knowledge/ 长期资产：

    目标位置：
    - primitive → knowledge/analysis/primitives/<domain_id>/<topic_slug>/artifact.md
    - synthesis → knowledge/analysis/synthesis/<topic_slug>/artifact.md
    - decision → knowledge/decisions/<domain_id>/<topic_slug>/artifact.md + verdict.md

    domain 是 taxonomy / 浏览分组概念，不作为独立的 object_type，不提供独立的 artifact.md。

    过程文件（request.md, plan.md）保留在 openspec/changes/，不进入 knowledge/。
    术语区默认折叠进 artifact.md 或 verdict.md。

    演进类 artifact 约束：
    - 遵循 `openspec/specs/canonical-output-model/spec.md` 中定义的演进类 artifact 质量约束
