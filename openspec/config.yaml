name: blockchain-research
version: 4
description: 面向区块链技术调研的研究驱动 OpenSpec 工作流

# =============================================================================
# Schema Package 注册（统一入口）
# =============================================================================
schemas:
  blockchain-research:
    path: openspec/schemas/blockchain-research/schema.yaml
    instruction: "用于生成、更新、审查并发布研究型 Knowledge artifact 的统一 schema package。"

default_schema: blockchain-research

change_roots:
  active: openspec/changes
  archive: openspec/changes/archive

knowledge_root: knowledge

# =============================================================================
# 系统约束：资产模型（单一事实源）
# =============================================================================
# 本仓库只有一套长期资产模型：
# - 过程层（staging area）：openspec/changes/<change-id>/ 中的 change.yaml, request.md, plan.md, draft.md 等
#   openspec/changes/<id>/ 是 staging area，不是最终 Knowledge artifact 存放区。
#   draft.md 是 staging candidate，通过 publish.md / publish_targets 映射到 Knowledge。
# - 长期资产层：knowledge/analysis/ 和 knowledge/decisions/ 中的 artifact.md / verdict.md
#   knowledge/**/artifact.md 才是最终 Knowledge artifact。
#
# knowledge/topics/ 是遗留目录，不再作为主线 canonical 资产目标
# atoms/claims/terms 是可选中间工作结构，不作为长期正式产物
# 不在 openspec/changes/<id>/ 下使用 primitives/、synthesis/、decisions/ 作为最终知识分类目录
# =============================================================================

context: |
  本仓库用于区块链与 AI 工程研究知识资产管理。
  openspec/changes/<id>/ 是 staging area，用于保存研究过程中的请求、计划、来源、支撑材料、候选产物、审查记录和发布映射。
  knowledge/**/artifact.md 才是最终 Knowledge artifact。
  openspec/changes/<id>/draft.md 是本 change 的唯一主候选产物，不是最终 Knowledge artifact。
  openspec/changes/<id>/notes/*.md 是 source-level digestion 的支撑材料。
  openspec/changes/<id>/claims/*.md 是可验证主张的支撑材料。
  change.yaml 是每个 change 的实例化 manifest，用于声明 task_type、change_operation、artifacts、validators 和 publish_targets。
  hooks 应优先读取 change.yaml，不通过路径硬猜 artifact 语义。

rules:
  request:
    - "必须说明研究目标、范围边界、目标 Knowledge artifact 类型。"
    - "必须说明本次 change 的 change_operation，例如 create、update、extend、supersede 或 merge。"
    - "不得直接写最终结论，request 只描述需求、边界和预期产物。"

  plan:
    - "必须声明本次 change 启用哪些 staging artifacts。"
    - "必须声明 evidence strategy：需要哪些 sources、哪些 source 需要升级为 note。"
    - "必须声明 draft.md 的目标 Knowledge 路径草案。"
    - "如果任务复杂，必须说明需要拆成哪些 child changes，而不是在当前 change 产出多个主候选产物。"

  source_pack:
    - "必须记录来源清单、来源类型、URL 或本地路径、访问时间、可信度备注。"
    - "source_pack 只记录来源入口和元信息，不写完整分析结论。"

  evidence_map:
    - "必须记录 source 如何支撑 notes、claims、draft 和 publish target。"
    - "必须标记证据覆盖缺口和不确定性。"

  note:
    - "仅当 source 值得独立理解、复用、审查或长期沉淀时生成 note。"
    - "note 是 source-level digestion 支撑材料，不是最终 primitive、synthesis 或 decision。"
    - "一个 change 可以有多个 notes/*.md。"

  claim:
    - "claim 只记录可验证、可引用、可复用的主张。"
    - "claim 必须能追溯到 source_pack 或 note。"
    - "不要把所有事实都拆成 claim，只提炼对 draft.md 有支撑价值的主张。"

  draft:
    - "draft.md 是本 change 的唯一主候选产物，不是最终 Knowledge artifact。"
    - "draft.md 可以发布为 source-note、primitive、synthesis 或 decision。"
    - "draft.md 必须能追溯到 sources、notes 或 claims。"
    - "draft.md 不得直接写入 knowledge/**。"

  review:
    - "review 负责语义审查、内容审查、证据充分性审查和人工确认项。"
    - "review 不替代自动 validation。"
    - "review 必须说明是否允许进入 publish。"

  publish:
    - "publish 必须明确 from/to 映射。"
    - "from 默认必须是 draft.md。"
    - "to 必须指向 knowledge/**/artifact.md 或 knowledge/decisions/**/verdict.md。"
    - "publish 不负责重新生成内容，只记录发布、合并、覆盖、拆分或保留策略。"

x_research:
  change_roots:
    active: openspec/changes
    archive: openspec/changes/archive
  knowledge_root: knowledge
  staging_dirs:
    - sources
    - notes
    - claims
    - review
    - validation
