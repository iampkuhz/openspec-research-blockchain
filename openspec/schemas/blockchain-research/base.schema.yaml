name: blockchain-research.base
description: "Harness 扩展契约。定义所有 research change 的公共结构、change.yaml 必填字段和通用 validator，不替代 schema.yaml 的 artifacts 定义。"

x_required_files:
  - change.yaml
  - request.md
  - plan.md
  - draft.md

x_standard_dirs:
  - sources
  - notes
  - claims
  - review
  - validation

x_change_yaml_required_fields:
  - id
  - schema
  - task_type
  - change_operation
  - execution_scope
  - artifacts
  - validators
  - publish_targets

x_common_validators:
  request:
    - required_files
    - markdown_sections
  plan:
    - markdown_sections
  source_pack:
    - source_pack
  evidence_map:
    - evidence_map
  note:
    - markdown_sections
    - traceability
  claim:
    - markdown_sections
    - traceability
  draft:
    - markdown_sections
    - traceability
  review:
    - markdown_sections
  publish:
    - publish_targets
    - traceability
