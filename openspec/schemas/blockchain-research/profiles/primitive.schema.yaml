id: blockchain-research.profile.primitive

applies_when:
  task_type: primitive

instruction: "用于主要目标是生成或更新 primitive Knowledge artifact 的 research change。"

required_artifacts:
  - request
  - plan
  - source_pack
  - draft

optional_artifacts:
  - evidence_map
  - note
  - claim
  - review
  - publish

allowed_publish_targets:
  - knowledge/analysis/primitives/**/artifact.md

artifact_constraints:
  draft:
    publish_target_type: knowledge_primitive
    validators:
      - markdown_sections
      - traceability
