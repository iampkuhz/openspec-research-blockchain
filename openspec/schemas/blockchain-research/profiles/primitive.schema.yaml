name: blockchain-research.profile.primitive
description: "用于主要目标是生成或更新 primitive Knowledge artifact 的 research change。"

x_applies_when:
  task_type: primitive

x_required_artifacts:
  - request
  - plan
  - source_pack
  - draft

x_optional_artifacts:
  - evidence_map
  - note
  - claim
  - review
  - publish

x_allowed_publish_targets:
  - knowledge/analysis/primitives/**/artifact.md

x_artifact_constraints:
  draft:
    publish_target_type: knowledge_primitive
    validators:
      - markdown_sections
      - traceability
