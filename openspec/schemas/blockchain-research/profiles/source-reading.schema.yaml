id: blockchain-research.profile.source_reading

applies_when:
  task_type: source_reading

instruction: "用于主要目标是生成或更新 source-note Knowledge artifact 的 research change。"

required_artifacts:
  - request
  - plan
  - source_pack
  - draft

optional_artifacts:
  - evidence_map
  - note
  - claim
  - review
  - publish

allowed_publish_targets:
  - knowledge/analysis/source-notes/**/artifact.md

artifact_constraints:
  draft:
    publish_target_type: knowledge_source_note
    validators:
      - markdown_sections
      - traceability
