name: blockchain-research.profile.source_reading
description: "用于主要目标是生成或更新 source-note Knowledge artifact 的 research change。"

x_applies_when:
  task_type: source_reading

x_required_artifacts:
  - request
  - plan
  - source_pack
  - draft

x_optional_artifacts:
  - evidence_map
  - note
  - claim
  - review
  - publish

x_allowed_publish_targets:
  - knowledge/analysis/source-notes/**/artifact.md

x_artifact_constraints:
  draft:
    publish_target_type: knowledge_source_note
    validators:
      - markdown_sections
      - traceability
