name: blockchain-research.profile.decision
description: "用于主要目标是生成或更新 decision artifact 或 verdict 的 research change。"

x_applies_when:
  task_type: decision

x_required_artifacts:
  - request
  - plan
  - source_pack
  - draft

x_optional_artifacts:
  - evidence_map
  - note
  - claim
  - review
  - publish

x_support_templates:
  - decision_criteria

x_allowed_publish_targets:
  - knowledge/decisions/**/artifact.md
  - knowledge/decisions/**/verdict.md

x_artifact_constraints:
  draft:
    publish_target_type: knowledge_decision
    validators:
      - markdown_sections
      - traceability

x_final_outputs:
  artifact:
    template: knowledge_artifact
    target: knowledge/decisions/**/artifact.md
    instruction: "从 draft.md 的 decision analysis 部分生成或更新 decision artifact。"

  verdict:
    template: decision_verdict
    target: knowledge/decisions/**/verdict.md
    depends_on:
      - decision_criteria
      - draft
    instruction: "基于 decision criteria 与 draft.md 中的取舍分析生成最终 verdict。"
