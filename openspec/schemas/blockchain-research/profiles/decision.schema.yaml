id: blockchain-research.profile.decision

applies_when:
  task_type: decision

instruction: "用于主产出是 decision artifact 及可选 verdict 的研究任务。"

required_artifacts:
  - request
  - plan
  - source_pack
  - work_product

optional_artifacts:
  - note
  - claim

artifact_rules:
  work_product:
    pattern: work-products/*.md
    instruction: "准备发布到 Knowledge 的 staging decision candidate。"
    publish_target_type: knowledge_decision
    validators:
      - markdown_sections
      - work_product
      - traceability

allowed_publish_targets:
  - knowledge/decisions/**
