name: blockchain-research
version: 1
description: 面向分层区块链技术调研的研究驱动 OpenSpec 工作流

artifacts:
  - id: request
    generates: request.md
    description: 定义研究问题、范围与非目标的研究入口文件
    template: request.md
    instruction: |
      为当前研究题目创建研究入口文件。

      必须完成：
      - 写清当前到底在问什么问题
      - 写清为什么现在需要研究这个问题
      - 明确范围与非目标
      - 标注研究对象属于 domain、primitive、synthesis、decision 中的哪一类
      - 写清预期输出是什么
      - 不提前写结论

      风格要求：
      - 中文优先
      - 英文术语优先保留
      - 技术导向、克制、非营销
      
      重要约束：
      - request.md 只负责定义问题，不要求提前回答完整机制
      - 像“为什么 4337 不直接改传统 transaction 路径”“bundler / EntryPoint / paymaster 属于什么层”这类后续确认问题，应放进 plan.md
    requires: []

  - id: plan
    generates: plan.md
    description: 合并研究计划与来源规划的集中 review 文件
    template: plan.md
    instruction: |
      为当前研究题目创建集中 review 用的研究计划文件，把 request 收紧成可执行计划。

      必须完成：
      - 写清研究路径：deep-dive、evolution、scenario 或 domain overview
      - 写清核心问题与后续确认问题
      - 写清当前研究预算：deep、focused 或 light
      - 写清本轮交付边界与完成标准
      - 按 L1、L2、L3、L4 规划来源，并说明每条来源为什么重要
      - 显式记录 evidence gap 与 unresolved ambiguity

      重要约束：
      - 这是 plan 文件，不是分析正文
      - plan.md 用于一次 review，同时承担原 brief.md 与 sources.md 的职责
      - 对 primitive，plan.md 必须显式列出后续确认的机制问题和边界问题
    requires:
      - request

  - id: dependencies
    generates: dependencies.md
    description: 显式声明下层依赖、预算、强度与抽取策略的依赖说明
    template: dependencies.md
    instruction: |
      当当前研究题目需要复用其他研究结果时，创建依赖说明。

      必须完成：
      - 列出依赖对象
      - 标注预算强度：deep、focused 或 light
      - 标注依赖强度：hard、medium 或 soft
      - 解释需要抽取什么
      - 解释哪些内容不会被重复叙述

      重要约束：
      - 对 synthesis 和 decision 尤其重要
      - 不要把下层全文搬运到上层
    requires:
      - plan

  - id: decision-criteria
    generates: decision-criteria.md
    description: 面向场景比较与选型的决策标准
    template: decision-criteria.md
    instruction: |
      为 scenario 类研究创建显式的决策标准文件。

      必须完成：
      - 定义具体场景
      - 区分 hard constraints、soft preferences、open questions
      - 解释每个标准为什么重要
      - 定义 confirmed、partial、unclear 的判定方式

      重要约束：
      - 只在需要比较或选型时使用
      - 不要写脱离实际场景的通用评分卡
    requires:
      - plan

  - id: evidence-matrix
    generates: evidence-matrix.md
    description: 把关键主张绑定到证据等级与置信度的证据矩阵
    template: evidence-matrix.md
    instruction: |
      创建证据矩阵，把关键主张与证据质量绑定起来。

      必须完成：
      - 写出关键主张
      - 标注其对应的 L1、L2、L3 或 L4 证据
      - 记录当前置信度与证据缺口
      - 区分确定事实、推断与不确定项

      重要约束：
      - 对 synthesis 和 decision 尤其重要
      - 不能让只依赖 L3/L4 的说法听起来像确定事实
    requires:
      - plan

  - id: draft
    generates: draft.md
    description: 合并术语、分析与有限结论的集中 review 文件
    template: draft.md
    instruction: |
      创建集中 review 用的研究草稿。

      必须完成：
      - 先补关键术语区，再进入分析正文
      - 先讲机制，再讨论价值
      - 解释设计原因与相关替代方案
      - 写清边界、前提、失败条件
      - 输出当前可以成立的有限结论
      - 写清当前不能确认什么、还缺什么证据
      - 如果是上层研究，只综合与当前问题直接相关的依赖内容
      - 区分协议原生能力、官方生态能力、第三方能力
      - 区分已上线、规划中、宣传性表述

      风格要求：
      - 中文优先
      - 英文术语优先保留
      - 技术导向、克制
      
      重要约束：
      - 术语区必须使用列表，而不是按词分标题
      - draft.md 用于一次 review，同时承担原 glossary.md、analysis.md、verdict.md 的职责
    requires:
      - plan

apply:
  requires: [draft]
  tracks: null
  instruction: |
    这个 schema 用于研究写作，不是代码实现。
    当执行 apply 时，应把研究改动包提炼为长期仓库资产：
    - 将稳定的事实分析提升到 knowledge/analysis/
    - 将稳定的场景判断提升到 knowledge/decisions/
    - request.md、plan.md、evidence-matrix.md 仍保留在 openspec/changes/ 中，不进入长期目录
    - primitive、synthesis、domain 的稳定内容提升为 knowledge 下的 reference.md
    - decision 的 verdict.md 可以保留在长期目录
    - 依赖声明提升为长期 dependencies.md
    - glossary 层默认折叠进 reference.md 或 decision 的 reference.md / verdict.md，不单独提升为长期 glossary.md
    - 把稳定的证据约束折叠进 reference.md 或 verdict.md
    - 不要用上层总结覆盖下层研究本身
